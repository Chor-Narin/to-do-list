name: Next.js CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # important for some linters that look at git history

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🎨 Check formatting (Prettier)
        run: npm run format:check || true   # ← add || true temporarily if you want to see errors without failing CI yet

      - name: 🔍 Run lint (ESLint / next lint)
        run: npm run lint
        env:
          CI: true          # tells many tools (eslint, prettier) to disable colors → cleaner logs
          FORCE_COLOR: 0    # extra insurance against weird ANSI escape codes in logs