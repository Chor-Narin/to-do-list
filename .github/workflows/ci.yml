name: Next.js CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-format:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🎨 Check formatting (Prettier)
        run: |
          npm run format:check || true
          npx prettier --check .
          npm run format

      - name: 🔍 Run lint (ESLint / next lint)
        run: npm run lint
        env:
          CI: true
          FORCE_COLOR: 0
